[project]
name = "java-finance-cloud-rag"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.6",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "langchain-core==1.8.0",
  "langchain-groq==1.1.3",
  "fastembed==0.9.1",
  "psycopg[binary]==3.3.9",
  "vercel-queue==0.11.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "cloud_app:app"

[[tool.vercel.subscribers]]
entrypoint = "tasks"

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  application:
    name: java-finance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/java_finance}
    username: ${DB_USER:java_finance}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
app:
  category-ai:
    enabled: ${CATEGORY_AI_ENABLED:false}
    url: ${CATEGORY_AI_URL:http://127.0.0.1:8123}
    token: ${CATEGORY_AI_TOKEN:}
  banking:
    client-id: ${PLUGGY_CLIENT_ID:}
    client-secret: ${PLUGGY_CLIENT_SECRET:}
    owner-id: ${PLUGGY_OWNER_ID:}
    item-ids: ${PLUGGY_ITEM_IDS:}
    webhook-secret: ${PLUGGY_WEBHOOK_SECRET:}
    cron-secret: ${CRON_SECRET:}
  hosting: ${APP_HOSTING:local}
  registration-enabled: ${REGISTRATION_ENABLED:false}
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

